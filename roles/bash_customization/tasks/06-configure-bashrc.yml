---
- name: "[06.01] Generate stable color for machine name"
  when: bash_customization_bash_hostname_color | default('', true) | length == 0
  ansible.builtin.set_fact:
    bash_customization_generated_bash_hostname_color: >-
      {{ (inventory_hostname | hash('sha1') | int(base=16)) % 229 }}
  tags:
    - bac.configure-bashrc
    - bac.06.01

- name: "[06.02] Copy bashrc file"
  ansible.builtin.template:
    src: "templates/bashrc.j2"
    dest: "/home/{{ bash_customization_default_user }}/.bashrc"
    owner: "{{ bash_customization_default_user }}"
    group: "{{ bash_customization_default_group }}"
    mode: "0640"
  tags:
    - bac.configure-bashrc
    - bac.06.02
