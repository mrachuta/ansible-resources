---
- name: "[01.01] Install required packages"
  ansible.builtin.package:
    name: "{{ bash_customization_packages_to_install }}"
    state: present
  tags:
    - bac.initial-setup
    - bac.01.01

- name: "Install virtualenvwrapper"
  become: true
  # Trick to skip passing this argument
  become_user: "{{ bash_customization_default_user | default(omit) }}"
  block:
    - name: "[01.02] Check pip support for --break-system-packages"
      ansible.builtin.command:
        argv:
          - "{{ ansible_facts[\"python\"][\"executable\"] }}"
          - -m
          - pip
          - install
          - --help
      register: bash_customization_pip_install_help
      changed_when: false
      tags:
        - bac.initial-setup
        - bac.01.02

    - name: "[01.03] Install virtualenvwrapper"
      ansible.builtin.pip:
        name: "virtualenvwrapper"
        extra_args: >-
          --user
          {% if '--break-system-packages' in bash_customization_pip_install_help.stdout %}--break-system-packages{% endif %}
      tags:
        - bac.initial-setup
        - bac.01.03

- name: "Enable bash-completion for kubectl if exists"
  block:
    - name: "[01.04] Check if kubectl command exists"
      ansible.builtin.command: bash -c 'command -v kubectl'
      register: bash_customization_kubectl_exists
      failed_when: '"No such" in bash_customization_kubectl_exists.stderr'
      changed_when: false
      tags:
        - bac.initial-setup
        - bac.01.04

    - name: "[01.05] Enable bash-completion for kubectl"
      when: bash_customization_kubectl_exists.rc == 0
      ansible.builtin.shell: |
        set -o pipefail
        kubectl completion bash | sudo tee /etc/bash_completion.d/kubectl > /dev/null
      args:
        creates: /etc/bash_completion.d/kubectl
        executable: /bin/bash
      tags:
        - bac.initial-setup
        - bac.01.05

- name: "Enable bash-completion for podman if exists"
  block:
    - name: "[01.06] Check if podman command exists"
      ansible.builtin.command: bash -c 'command -v podman'
      register: bash_customization_podman_exists
      failed_when: '"No such" in bash_customization_podman_exists.stderr'
      changed_when: false
      tags:
        - bac.initial-setup
        - bac.01.06

    - name: "[01.07] Enable bash-completion for podman"
      when: bash_customization_podman_exists.rc == 0
      ansible.builtin.shell: |
        set -o pipefail
        podman completion bash | sudo tee /etc/bash_completion.d/podman > /dev/null
      args:
        creates: /etc/bash_completion.d/podman
        executable: /bin/bash
      tags:
        - bac.initial-setup
        - bac.01.07

- name: "Ensure 'python3' command exists"
  block:
    - name: "[01.08] Check if /usr/bin/python3 exists"
      ansible.builtin.stat:
        path: "/usr/bin/python3"
      register: bash_customization_python3_command
      tags:
        - bac.initial-setup
        - bac.01.08

    - name: "[01.09]  Create symlink if 'python3' command not exists"
      when: not bash_customization_python3_command.stat.exists
      ansible.builtin.file:
        src: "/usr/bin/python3.{{ ansible_facts[\"python\"][\"version\"][\"micro\"] }}"
        dest: "/usr/bin/python3"
        state: link
      tags:
        - bac.initial-setup
        - bac.01.09
