---
- name: "[04.01] Create tmux plugins dir"
  ansible.builtin.file:
    path: "/home/{{ bash_customization_default_user }}/.tmux/plugins"
    state: directory
    mode: '0750'
    owner: "{{ bash_customization_default_user }}"
    group: "{{ bash_customization_default_group }}"
  tags:
    - bac.configure-tmux
    - bac.04.01

- name: "[04.02] Pull required tmux addons from github"
  become: true
  become_user: "{{ bash_customization_default_user }}"
  ansible.builtin.git:
    repo: https://github.com/tmux-plugins/tpm
    dest: "/home/{{ bash_customization_default_user }}/.tmux/plugins/tpm"
    recursive: true
    version: master
    # Ensure that during next run there will be no errors with local changes
    force: true
    depth: 1
    single_branch: true
  tags:
    - bac.configure-tmux
    - bac.04.02

- name: "[04.03] Copy tmux config template"
  ansible.builtin.template:
    src: "templates/tmux.conf.j2"
    dest: "/home/{{ bash_customization_default_user }}/.tmux.conf"
    owner: "{{ bash_customization_default_user }}"
    group: "{{ bash_customization_default_group }}"
    mode: "0640"
  tags:
    - bac.configure-tmux
    - bac.04.03
