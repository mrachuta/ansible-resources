---
- name: "[02.01] Ensure sudo"
  ansible.builtin.package:
    name: "sudo"
    state: present
  tags:
    - vmc.setup-accounts-and-privileges
    - vmc.02.01

- name: "[02.02] Get existing users"
  ansible.builtin.getent:
    database: passwd
  tags:
    - vmc.setup-accounts-and-privileges
    - vmc.02.02

- name: "[02.03] Get existing groups"
  ansible.builtin.getent:
    database: group
  tags:
    - vmc.setup-accounts-and-privileges
    - vmc.02.03

- name: "[02.04] Remove root password"
  when: vm_configuration_remove_root_password | bool
  ansible.builtin.user:
    name: root
    password_lock: true
  tags:
    - vmc.setup-accounts-and-privileges
    - vmc.02.04

- name: "[02.05] Generate password for default user"
  when: vm_configuration_create_default_user | bool and vm_configuration_default_user not in ansible_facts["getent_passwd"].keys()
  ansible.builtin.set_fact:
    vm_configuration_generated_password: "{{ lookup('password', '/dev/null length=16 chars=ascii_letters,digits') }}"
  no_log: true
  tags:
    - vmc.setup-accounts-and-privileges
    - vmc.02.05

- name: "Create technical user and reconfigure it"
  when: vm_configuration_create_technical_user | bool
  block:
    - name: "[02.06] Create technical user"
      ansible.builtin.user:
        name: "{{ vm_configuration_technical_user }}"
        shell: /bin/bash
        state: present
        password_lock: true
      tags:
        - vmc.setup-accounts-and-privileges
        - vmc.02.06

    - name: "[02.07] Add technical user to sudo"
      when: "'sudo' in ansible_facts[\"getent_group\"].keys()"
      ansible.builtin.user:
        name: "{{ vm_configuration_technical_user }}"
        groups: sudo
        state: present
      tags:
        - vmc.setup-accounts-and-privileges
        - vmc.02.07

    - name: "[02.08] Add technical user to wheel"
      when: "'wheel' in ansible_facts[\"getent_group\"].keys()"
      ansible.builtin.user:
        name: "{{ vm_configuration_technical_user }}"
        groups: wheel
        state: present
      tags:
        - vmc.setup-accounts-and-privileges
        - vmc.02.08

    - name: "[02.09] Set authorized key for technical user"
      when: vm_configuration_technical_user_ssh_keys_paths is not none and not ansible_check_mode
      ansible.posix.authorized_key:
        user: "{{ vm_configuration_technical_user }}"
        state: present
        key: "{{ lookup('file', item) }}"
      loop: "{{ vm_configuration_technical_user_ssh_keys_paths }}"
      tags:
        - vmc.setup-accounts-and-privileges
        - vmc.02.09

- name: "Create default user and configure it"
  when: vm_configuration_create_default_user | bool
  block:
    # Create user and allow to alter params
    - name: "[02.10] Create default user"
      ansible.builtin.user:
        name: "{{ vm_configuration_default_user }}"
        state: present
        shell: /bin/bash
      tags:
        - vmc.setup-accounts-and-privileges
        - vmc.02.10

    - name: "[02.11] Add default user to sudo"
      when: "(vm_configuration_add_default_user_to_sudo | bool) and ('sudo' in ansible_facts[\"getent_group\"].keys())"
      ansible.builtin.user:
        name: "{{ vm_configuration_default_user }}"
        groups: sudo
        state: present
      tags:
        - vmc.setup-accounts-and-privileges
        - vmc.02.11

    - name: "[02.12] Add default user to wheel"
      when: "(vm_configuration_add_default_user_to_sudo | bool) and ('wheel' in ansible_facts[\"getent_group\"].keys())"
      ansible.builtin.user:
        name: "{{ vm_configuration_default_user }}"
        groups: wheel
        state: present
      tags:
        - vmc.setup-accounts-and-privileges
        - vmc.02.12

    # Do not change password if user already exist
    - name: "[02.13] Alter default user password"
      when: vm_configuration_default_user not in ansible_facts["getent_passwd"].keys()
      ansible.builtin.user:
        name: "{{ vm_configuration_default_user }}"
        password: "{{ vm_configuration_generated_password | password_hash('sha512', rounds=5000) }}"
      no_log: true
      tags:
        - vmc.setup-accounts-and-privileges
        - vmc.02.13

    - name: "[02.14] Set authorized key for default user"
      when: vm_configuration_default_user_ssh_keys_paths is not none and not ansible_check_mode
      ansible.posix.authorized_key:
        user: "{{ vm_configuration_default_user }}"
        state: present
        key: "{{ lookup('file', item) }}"
      loop: "{{ vm_configuration_default_user_ssh_keys_paths }}"
      tags:
        - vmc.setup-accounts-and-privileges
        - vmc.02.14

    - name: "[02.15] Ensure local secrets directory exists"
      when: not (vm_configuration_use_vault | bool)
      run_once: true
      delegate_to: localhost
      become: false
      ansible.builtin.file:
        path: "{{ vm_configuration_local_secrets_dir }}"
        state: directory
        mode: "0700"
      tags:
        - vmc.setup-accounts-and-privileges
        - vmc.02.15

    - name: "[02.16] Check if password for default user is already saved locally"
      when: >-
        vm_configuration_create_default_user | bool and
        vm_configuration_default_user not in ansible_facts["getent_passwd"].keys() and
        not (vm_configuration_use_vault | bool)
      delegate_to: localhost
      become: false
      ansible.builtin.stat:
        path: "{{ vm_configuration_default_user_password_download_path }}"
      register: vm_configuration_password_file
      tags:
        - vmc.setup-accounts-and-privileges
        - vmc.02.16

    - name: "[02.17] Save generated default-user password locally"
      when: >
        vm_configuration_create_default_user | bool and
        vm_configuration_default_user not in ansible_facts["getent_passwd"].keys() and
        not (vm_configuration_use_vault | bool) and
        not vm_configuration_password_file.stat.exists
      delegate_to: localhost
      ansible.builtin.copy:
        content: "{{ vm_configuration_generated_password }}"
        dest: "{{ vm_configuration_default_user_password_download_path }}"
        mode: "0600"
      no_log: false
      tags:
        - vmc.setup-accounts-and-privileges
        - vmc.02.17

    - name: "[02.18] Save generated default-user credentials in Vault"
      when: >-
        vm_configuration_create_default_user | bool and
        vm_configuration_default_user not in ansible_facts["getent_passwd"].keys() and
        vm_configuration_use_vault | bool
      delegate_to: localhost
      become: false
      community.hashi_vault.vault_kv2_write:
        url: "{{ lookup('ansible.builtin.env', 'ANSIBLE_HASHI_VAULT_ADDR') }}"
        auth_method: approle
        mount_point: "{{ lookup('ansible.builtin.env', 'ANSIBLE_HASHI_VAULT_MOUNT_POINT') | default('approle', true) }}"
        role_id: "{{ lookup('ansible.builtin.env', 'ANSIBLE_HASHI_VAULT_ROLE_ID') }}"
        secret_id: "{{ lookup('ansible.builtin.env', 'ANSIBLE_HASHI_VAULT_SECRET_ID') }}"
        path: "resources/{{ inventory_hostname.split('-')[1] }}/vm/{{ inventory_hostname }}"
        engine_mount_point: secret
        read_before_write: true
        data: >-
          {{
            vm_configuration_vm_access_secret | combine({
              'default_user_username': vm_configuration_default_user,
              'default_user_password': vm_configuration_generated_password
            })
          }}
      vars:
        vm_configuration_vm_access_secret: >-
          {{ lookup(
            'community.hashi_vault.vault_kv2_get',
            'resources/' ~ inventory_hostname.split('-')[1] ~ '/vm/' ~ inventory_hostname,
            engine_mount_point='secret'
          ).secret }}
      no_log: true
      tags:
        - vmc.setup-accounts-and-privileges
        - vmc.02.18
