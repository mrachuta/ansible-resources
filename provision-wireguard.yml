---
- name: Install and configure WireGuard
  hosts: "{{ target_hosts | default('wireguard') }}"
  become: true
  gather_facts: false

  handlers:
    - name: Restart WireGuard
      ansible.builtin.systemd:
        name: wg-quick@wg0
        state: restarted

    - name: Reload sysctl
      ansible.builtin.command:
        cmd: sysctl --system
      changed_when: false

  pre_tasks:
    - name: "Configure Vault authentication"
      when: ansible_use_vault_for_authentication | default(false) | bool
      ansible.builtin.include_role:
        name: vm_vault_authentication
      vars:
        vm_vault_authentication_vault_secret_path: "infra/ansible"

    - name: Read WireGuard configuration from Vault
      ansible.builtin.set_fact:
        wireguard_vault_secret: >-
          {{ lookup(
            'community.hashi_vault.vault_kv2_get',
            'infra/wireguard',
            engine_mount_point='secret'
          ).secret }}
        cacheable: false
      delegate_to: localhost
      become: false
      no_log: true

  tasks:
    - name: Install WireGuard and dependencies
      ansible.builtin.apt:
        name:
          - wireguard
          - iptables
          - resolvconf
          - qrencode
        state: present
        update_cache: true

    - name: Create WireGuard configuration directory
      ansible.builtin.file:
        path: /etc/wireguard
        state: directory
        owner: root
        group: root
        mode: '0700'

    # This file is required by wireguard-install.sh as configuration source.
    - name: Deploy WireGuard helper configuration from Vault
      ansible.builtin.template:
        src: resources/wireguard/params.j2
        dest: /etc/wireguard/params
        owner: root
        group: root
        mode: '0600'

    - name: Deploy WireGuard interface configuration from Vault
      ansible.builtin.template:
        src: resources/wireguard/wg0.conf.j2
        dest: /etc/wireguard/wg0.conf
        owner: root
        group: root
        mode: '0600'
      notify: Restart WireGuard

    - name: Enable IP forwarding for WireGuard
      ansible.builtin.copy:
        dest: /etc/sysctl.d/wg.conf
        content: |
          net.ipv4.ip_forward = 1
          net.ipv6.conf.all.forwarding = 1
        owner: root
        group: root
        mode: '0644'
      notify: Reload sysctl

    - name: Ensure WireGuard service is enabled and started
      ansible.builtin.systemd:
        name: wg-quick@wg0
        enabled: true
        state: started

    - name: Create directory for WireGuard helper script
      ansible.builtin.file:
        path: /opt/wireguard
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Download wireguard-install helper script
      ansible.builtin.get_url:
        # No versioning
        url: https://raw.githubusercontent.com/angristan/wireguard-install/refs/heads/master/wireguard-install.sh
        dest: /opt/wireguard/wireguard-install.sh
        mode: '0700'
        owner: root
        group: root
