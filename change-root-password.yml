- name: Securely change root password and record it
  hosts: "{{ target_hosts | default('all') }}"
  gather_facts: false
  become: true

  tasks:
    - name: Ensure local secrets directory exists
      delegate_to: localhost
      become: false
      ansible.builtin.file:
        path: "{{ ansible_local_created_secrets_dir }}"
        state: directory
        mode: "0700"

    - name: Generate a new secure password for root
      ansible.builtin.set_fact:
        root_new_password: "{{ lookup('password', '/dev/null length=16 chars=ascii_letters,digits') }}"

    - name: Apply new, hashed password to the 'root' user
      ansible.builtin.user:
        name: root
        password: "{{ root_new_password | password_hash('sha512', rounds=5000) }}"

    - name: Save the new password
      ansible.builtin.copy:
        content: "{{ root_new_password }}"
        dest: "{{ ansible_local_created_secrets_dir }}/user__root__password"
        mode: '0600'
      delegate_to: localhost
