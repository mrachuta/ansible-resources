trigger:
  - master

stages:
  - stage: StaticAnalysis
    jobs:
      - job: StaticAnalysis
        pool:
          name: mdp-adotest-dev-ncus-01
          demands:
            - ImageOverride -equals ubuntu22-ado
        steps:
          - bash: |
              set -euo pipefail
              python3.12 -m venv "$(Agent.TempDirectory)/ansible-lint-venv"
              "$(Agent.TempDirectory)/ansible-lint-venv/bin/python" \
                -m pip install -r requirements.txt
            workingDirectory: $(Build.SourcesDirectory)
            displayName: 'Install lint dependencies'
          - bash: |
              set -euo pipefail
              "$(Agent.TempDirectory)/ansible-lint-venv/bin/ansible-lint" --version
              "$(Agent.TempDirectory)/ansible-lint-venv/bin/ansible-lint"
            workingDirectory: $(Build.SourcesDirectory)
            displayName: 'Run ansible-lint'

  - stage: FunctionalTestsUbuntu22
    dependsOn: StaticAnalysis
    jobs:
      - template: templates/ansible-test-job.yaml
        parameters:
          jobName: FunctionalTestsUbuntu22
          imageName: 'ubuntu22-ado'
          pipExecutable: 'pip3'
          pythonExecutable: 'python3'

  - stage: FunctionalTestsRHEL9
    dependsOn: FunctionalTestsUbuntu22
    jobs:
      - template: templates/ansible-test-job.yaml
        parameters:
          jobName: FunctionalTestsRHEL9
          imageName: 'rhel9-ado'
          pipExecutable: 'pip3'
          pythonExecutable: 'python3'
