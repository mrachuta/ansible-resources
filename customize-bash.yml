- name: "Run role bash_customization"
  hosts: "{{ target_hosts | default('all') }}"
  become: true
  gather_facts: "{{ not (ansible_use_vault_for_authentication | default(false) | bool) }}"
  pre_tasks:
    - name: "Configure Vault authentication"
      when: ansible_use_vault_for_authentication | default(false) | bool
      ansible.builtin.include_role:
        name: vm_vault_authentication
      vars:
        vm_vault_authentication_vault_secret_path: "infra/ansible"
  roles:
    - role: bash_customization

# Example run:
# ansible-playbook -i inventory/default.yml -e "target_hosts=myhost" \
# customize-bash.yml
#
# Example run against localhost:
# ansible-playbook -i inventory/default.yml -e "target_hosts=wsl" \
# --connection=local --diff \
# customize-bash.yml
#
# Example run with vault
# ansible-playbook -i inventory/default.yml -i inventory/proxmox.proxmox.yml \
# -e target_hosts=proxmox -e ansible_use_vault_for_authentication=true \
# customize-bash.yml
