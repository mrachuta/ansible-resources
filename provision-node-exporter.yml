- name: Provision node-exporter
  hosts: "{{ target_hosts | default('remote') }}"
  become: true
  gather_facts: "{{ not (ansible_use_vault_for_authentication | default(false) | bool) }}"
  pre_tasks:
    - name: "Configure Vault authentication"
      when: ansible_use_vault_for_authentication | default(false) | bool
      ansible.builtin.include_role:
        name: vm_vault_authentication
      vars:
        vm_vault_authentication_vault_secret_path: "infra/ansible"

    - name: "Gather system user and group facts"
      ansible.builtin.getent:
        database: "{{ item }}"
      loop:
        - passwd
        - group

    - name: "Create system group node-exp"
      when: "'node-exp' not in (ansible_facts[\"getent_group\"] | default({}))"
      ansible.builtin.group:
        name: "node-exp"
        system: true
        state: present
      become: true

    - name: "Create system user node-exp"
      when: "'node-exp' not in (ansible_facts[\"getent_passwd\"] | default({}))"
      ansible.builtin.user:
        name: "node-exp"
        system: true
        shell: "/usr/sbin/nologin"
        group: "node-exp"
        home: "/"
        create_home: false
      become: true

    - name: Ensure /var/lib/node_exporter/textfile_collector" exists
      ansible.builtin.file:
        path: "/var/lib/node_exporter/textfile_collector"
        state: directory
        owner: node-exp
        group: node-exp
        mode: "0775"

    - name: Create node_exporter cert dir
      when: "'kubernetes' not in group_names"
      ansible.builtin.file:
        path: "/etc/node_exporter"
        state: directory
        owner: node-exp
        group: node-exp
        mode: "0775"

    - name: Copy certs
      when: "'kubernetes' not in group_names"
      ansible.builtin.copy:
        src: "secrets/static/node_exporter/{{ item }}"
        dest: "/etc/node_exporter/{{ item | basename }}"
        owner: node-exp
        group: node-exp
        mode: "0740"
      loop:
        - "{{ inventory_hostname }}/{{ inventory_hostname }}.crt"
        - "{{ inventory_hostname }}/{{ inventory_hostname }}.key"

  roles:
    - role: prometheus.prometheus.node_exporter
      when: "'kubernetes' not in group_names"
      node_exporter_textfile_dir: "/var/lib/node_exporter/textfile_collector"

  tasks:
    - name: Copy script to generate node_os_updates metrics to remote
      ansible.builtin.template:
        src: resources/node_exporter/node_os_updates_metrics.sh.j2
        dest: /var/lib/node_exporter/node_os_updates_metrics.sh
        owner: node-exp
        group: node-exp
        mode: '0740'

    - name: Create a cron entry to run script periodically
      ansible.builtin.cron:
        name: "Post node_os_updates metrics"
        minute: "0"
        hour: "*/4"
        day: "*"
        month: "*"
        weekday: "*"
        job: "/var/lib/node_exporter/node_os_updates_metrics.sh"
        user: root
